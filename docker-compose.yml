version: '3.8'

services:
  nexus-rag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-rag-assistant
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Nexus RAG - Enterprise Assistant
      - APP_ENV=production
      - SECRET_KEY=${SECRET_KEY:-enterprise_super_secret_jwt_key_change_in_production_2026}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-smart_local}
      - DEFAULT_EMBEDDING_PROVIDER=${DEFAULT_EMBEDDING_PROVIDER:-local_dense}
      - CHUNK_SIZE=700
      - CHUNK_OVERLAP=150
      - TOP_K_RESULTS=4
    volumes:
      # Persist SQLite database and uploaded PDF documents
      - rag_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  rag_data:
    driver: local
